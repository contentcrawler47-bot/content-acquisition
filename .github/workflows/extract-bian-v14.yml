name: Extract — BIAN v14 (stage 1)

# STAGE 1 only: acquire the landscape model and store it as data. Renders
# nothing, filters nothing, and publishes nothing.
#
# References NO Google Drive secrets, so a red run here is always a source or
# code problem. That separation is load-bearing for diagnosis and must survive:
# if this workflow ever publishes, publishing belongs in its own job.
#
# The extract is uploaded as an artifact and deliberately NOT synced to Drive.
# The first runs were meant to answer whether a Drive scope was viable; they
# did, and the answer is that it is not needed. Storage was never the obstacle
# — the extract is well under 1% of a free quota. Stage 2 reads an extract from
# disk within the same run, so nothing reads a stored extract back, and a Drive
# copy would be a sync path no run exercises.
#
# Nothing here applies the category allowlist. That is deliberate and is the
# point of the split — selection belongs to stage 2, so changing
# INCLUDE_CATEGORIES becomes a re-render against a stored extract rather than
# 47 more shard requests against someone else's web server.
#
# Two scopes. `model-only` takes the shards and index files, about a minute of
# fetching. `full` additionally fetches every view page and stores its geometry
# as nodes and edges — several hundred requests against someone else's web
# server, which is why this workflow is dispatch-only and must stay so.
#
# Reports counts, sizes and digests only, never acquired text: Actions logs on
# a public repo are world-readable.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Extract scope
        type: choice
        options:
          - model-only
          - full
        default: model-only
      require_schema:
        description: Fail if jsonschema is unavailable
        type: boolean
        default: true
      gate_observe_only:
        description: >-
          Record source-gate findings without failing on them, including
          bound breaches. Fetch, parse and schema findings still fail either
          way. Default is now FALSE: the thresholds were set from measurement
          in changeset 064 and the gate enforces. Turn this on to measure a
          new landscape version before deciding its numbers, not to get a red
          run past.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: extract-bian-v14
  cancel-in-progress: true

env:
  SOURCE_ID: bian-v14
  # The canary and floors are stated here rather than hidden in the tool so a
  # reader of the run can see what was demanded of it. They are bounds, not
  # equalities: a gate that catches a broken mechanism, not one demanding
  # perfection. Never widen one to turn a red run green.
  CANARY_ID: "34300"
  CANARY_NAME: Consumer Loan
  MIN_OBJECTS: "100000"
  MIN_VIEWS: "2000"
  MIN_SERVICE_DOMAINS: "340"
  # Source input gate. Stated here, like the canary and the floors, so a
  # reader of the run can see what was demanded of it.
  #
  # SET FROM MEASUREMENT on run 33489429857 (full) and 33488890577
  # (model-only), which agree. The whole measured population is now declared:
  # G03 1,359, G15 42,861, G23 10, plus two sampled findings, each REGISTERED
  # with a bound. So the thresholded population is empty, and anything landing
  # in it is something undeclared that has appeared -- for which the honest
  # bound is near zero rather than a margin sized to clear a known defect.
  #
  # These are deliberately tight. A source that changes shape SHOULD turn the
  # build red; the alternative is a bound wide enough to hide the next fault.
  # The counts have not moved across seven consecutive runs, so there is no
  # variance here to accommodate.
  #
  # Never widen one to turn a red run green. If a measurement legitimately
  # moves, that is a DECISION-LOG entry and a new number, not an edit to make
  # CI pass.
  GATE_MAX_SHARE: "0.05"
  GATE_MAX_ABSOLUTE: "25"
  GATE_MAX_TOTAL_SHARE: "0.1"

jobs:
  extract:
    name: Can we store the BIAN model as data?
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Pinned, because requirements-extract.txt hashes a compiled wheel
      # (rpds-py) built per interpreter version. Taking whatever Python the
      # runner image ships would mean an image bump silently selecting a wheel
      # with no matching hash.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Both files. setup-python provides a clean interpreter, so without
      # requirements.txt the API source fails to import and discovery reports
      # it as a load failure — harmless for this source, but indistinguishable
      # in the log from a real one.
      - name: Install pinned validation dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements.txt
          python3 -m pip install --require-hashes -r requirements-extract.txt

      - name: Build the extract
        run: |
          python3 run.py extract "$SOURCE_ID" --mode "${{ inputs.mode }}" \
            --gate-max-share "$GATE_MAX_SHARE" \
            --gate-max-absolute "$GATE_MAX_ABSOLUTE" \
            --gate-max-total-share "$GATE_MAX_TOTAL_SHARE" \
            ${{ inputs.gate_observe_only && '--gate-observe-only' || '' }}

      - name: Check the extract
        run: |
          python3 tools/check_extract.py "out/_extract/$SOURCE_ID" \
            ${{ inputs.require_schema && '--require-schema' || '' }} \
            --require-gate \
            --canary-id "$CANARY_ID" \
            --canary-name "$CANARY_NAME" \
            --min-objects "$MIN_OBJECTS" \
            --min-views "$MIN_VIEWS" \
            --min-service-domains "$MIN_SERVICE_DOMAINS"

      # Kept whether or not the checks passed: a failed extract is the thing
      # you most want to look at, and re-running it costs another pass over
      # bian.org.
      #
      # 90 days, the maximum for a public repo. The window is NOT for CI reuse:
      # nothing downloads this artifact from a later run, and no permission here
      # would let it. It is for the investigation loop — download the artifact,
      # unzip it in a sandbox and query the whole population — which has settled
      # several questions that resisted reasoning about them.
      - name: Upload the extract
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extract-${{ env.SOURCE_ID }}
          path: out/_extract/${{ env.SOURCE_ID }}/
          retention-days: 90
          if-no-files-found: error
