name: Extract — BIAN v14 (stage 3)

# Acquire, then extract from the run just written. Renders nothing, filters
# nothing, and publishes nothing.
#
# Two steps against the source and the store, in this order (R3): `acquire`
# fetches the landscape's artifacts and RETAINS them under out/_raw/, with
# provenance; `extract` then parses THAT run and never the source. The extract
# therefore names the bytes it was built from (`extract.run.raw_run_id`) and
# the code that fetched them, and re-parsing the same run later -- from the
# CI artifact or from the Drive archive -- must reproduce its content digest.
# The acceptance test for this arrangement was exactly that: run
# 33848524733-1, downloaded from Drive, re-normalised offline, a82abbd7e52e8558.
#
# References NO Google Drive secrets, so a red run here is always a source or
# code problem. That separation is load-bearing for diagnosis and must survive:
# archiving a run to Drive is the Acquire workflow's second job, and if this
# workflow ever archives or publishes, that belongs in its own job. Which step
# is red halves the search: a red `Acquire` is the source; a red `Check the
# run` is a declared artifact the source did not serve; a red `Build the
# extract` is the parser or a run that no longer matches its own manifest; a
# red `Check the extract` is the gate or a floor.
#
# Nothing here applies the category allowlist. That is deliberate and is the
# point of the split — selection belongs to the render stage, so changing
# INCLUDE_CATEGORIES becomes a re-render against a stored extract rather than
# 47 more shard requests against someone else's web server.
#
# Two scopes, chosen at acquisition; the extract's mode is the run's.
# `model-only` takes the shards and index files and the gate's twelve-file
# sample, about a minute of fetching. `full` additionally fetches every
# declared view page and stores its geometry as nodes and edges — several
# hundred requests against someone else's web server, which is why this
# workflow is dispatch-only and must stay so.
#
# Reports counts, sizes and digests only, never acquired text: Actions logs on
# a public repo are world-readable.

# TRIGGERS: workflow_dispatch / schedule only. Never pull_request or
# pull_request_target -- the Actions cache is private only while no fork
# PR can run a workflow in this repo (D-14).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Acquisition scope; the extract's mode follows the run
        type: choice
        options:
          - model-only
          - full
        default: model-only
      require_schema:
        description: Fail if jsonschema is unavailable
        type: boolean
        default: true
      gate_observe_only:
        description: >-
          Record source-gate findings without failing on them, including
          bound breaches. Fetch, parse and schema findings still fail either
          way. Default is now FALSE: the thresholds were set from measurement
          in changeset 064 and the gate enforces. Turn this on to measure a
          new landscape version before deciding its numbers, not to get a red
          run past.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: extract-bian-v14
  cancel-in-progress: true

env:
  SOURCE_ID: bian-v14
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  # The same directory `run.py acquire` derives from GITHUB_RUN_ID and
  # GITHUB_RUN_ATTEMPT, so the later steps can name it without the acquire
  # step telling them.
  RUN_DIR: out/_raw/bian-v14/${{ github.run_id }}-${{ github.run_attempt }}
  # The canary and floors are stated here rather than hidden in the tool so a
  # reader of the run can see what was demanded of it. They are bounds, not
  # equalities: a gate that catches a broken mechanism, not one demanding
  # perfection. Never widen one to turn a red run green.
  CANARY_ID: "34300"
  CANARY_NAME: Consumer Loan
  MIN_OBJECTS: "100000"
  MIN_VIEWS: "2000"
  MIN_SERVICE_DOMAINS: "340"
  # Source input gate. Stated here, like the canary and the floors, so a
  # reader of the run can see what was demanded of it.
  #
  # SET FROM MEASUREMENT on run 33489429857 (full) and 33488890577
  # (model-only), which agree. The whole measured population is now declared:
  # G03 1,359, G15 42,861, G23 10, plus two sampled findings, each REGISTERED
  # with a bound. So the thresholded population is empty, and anything landing
  # in it is something undeclared that has appeared -- for which the honest
  # bound is near zero rather than a margin sized to clear a known defect.
  #
  # These are deliberately tight. A source that changes shape SHOULD turn the
  # build red; the alternative is a bound wide enough to hide the next fault.
  # The counts have not moved across seven consecutive runs, so there is no
  # variance here to accommodate.
  #
  # Never widen one to turn a red run green. If a measurement legitimately
  # moves, that is a DECISION-LOG entry and a new number, not an edit to make
  # CI pass.
  GATE_MAX_SHARE: "0.05"
  GATE_MAX_ABSOLUTE: "25"
  GATE_MAX_TOTAL_SHARE: "0.1"

jobs:
  extract:
    name: Can we retain the BIAN landscape and store its model as data?
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit only: records egress, blocks nothing. Move to block
          # once a month of audit shows no unexpected hosts (A.15).
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Pinned, because requirements-extract.txt hashes a compiled wheel
      # (rpds-py) built per interpreter version. Taking whatever Python the
      # runner image ships would mean an image bump silently selecting a wheel
      # with no matching hash.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Both files. setup-python provides a clean interpreter, so without
      # requirements.txt the API source fails to import and discovery reports
      # it as a load failure — harmless for this source, but indistinguishable
      # in the log from a real one.
      - name: Install pinned validation dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements.txt
          python3 -m pip install --require-hashes -r requirements-extract.txt

      - name: Acquire
        run: |
          python3 run.py acquire "$SOURCE_ID" --mode "${{ inputs.mode }}"

      # Finished, intact, whole -- before anything reads it. A partial run is
      # red here: an extract built from it would be thin in a way the floors
      # below might or might not catch, and the run itself is still uploaded
      # as evidence.
      - name: Check the run
        if: always()
        run: |
          python3 tools/check_raw.py "$RUN_DIR" --require-complete

      - name: Build the extract
        run: |
          python3 run.py extract "$SOURCE_ID" --run-dir "$RUN_DIR" \
            --gate-max-share "$GATE_MAX_SHARE" \
            --gate-max-absolute "$GATE_MAX_ABSOLUTE" \
            --gate-max-total-share "$GATE_MAX_TOTAL_SHARE" \
            ${{ inputs.gate_observe_only && '--gate-observe-only' || '' }}

      - name: Check the extract
        run: |
          python3 tools/check_extract.py "out/_extract/$SOURCE_ID" \
            ${{ inputs.require_schema && '--require-schema' || '' }} \
            --require-gate \
            ${{ inputs.gate_observe_only && '--allow-observe-only' || '' }} \
            --canary-id "$CANARY_ID" \
            --canary-name "$CANARY_NAME" \
            --min-objects "$MIN_OBJECTS" \
            --min-views "$MIN_VIEWS" \
            --min-service-domains "$MIN_SERVICE_DOMAINS"

      # Kept whether or not the checks passed: a failed extract is the thing
      # you most want to look at, and re-running it costs another pass over
      # bian.org. `warn` rather than `error` when nothing was written -- a red
      # acquire means no extract, and the run should emit one error, not two.
      #
      # 90 days, the maximum for a public repo. The window is NOT for CI reuse:
      # nothing downloads this artifact from a later run, and no permission here
      # would let it. It is for the investigation loop — download the artifact,
      # unzip it in a sandbox and query the whole population — which has settled
      # several questions that resisted reasoning about them.
      - name: Upload the extract
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: extract-${{ env.SOURCE_ID }}
          path: out/_extract/${{ env.SOURCE_ID }}/
          retention-days: 90
          if-no-files-found: warn

      # The run the extract was built from, under the same name the Acquire
      # workflow uses, so the two are interchangeable to `check_raw.py` and to
      # a re-extract. Not archived from here: that is the Acquire workflow's
      # job, with its own credentials.
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: raw-${{ env.SOURCE_ID }}-${{ env.RUN_ID }}
          path: ${{ env.RUN_DIR }}/
          retention-days: 90
          if-no-files-found: warn
