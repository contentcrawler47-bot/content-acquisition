name: Render — BIAN v14 (stage 2)

# STAGE 2: read a stored extract, apply the allowlist, report what would be
# published. Makes NO network requests at all — not to bian.org, not to Drive,
# not to the Actions API.
#
# References no secrets and fetches no source, so a red run here is a
# SELECTION or CODE problem, or a MISSING INPUT that this workflow says how to
# regenerate, and nothing else. That separation is the same one the Extract
# and Validate workflows keep, and it is what makes a failure locatable
# without reading the log.
#
# WHAT THIS IS FOR
#   Changing what gets published used to mean another pass over someone else's
#   web server. Against a stored extract it is a re-render: run this with
#   --add-category or --drop-category and read the numbers. That is the whole
#   payoff of splitting extraction from rendering.
#
#   An experimental run is announced before and after its own numbers and can
#   never publish — this workflow writes no bundle and syncs nothing.
#
# WHAT IT DOES NOT DO YET
#   Selection only. Grouping, link resolution and diagram rendering are not
#   built. This workflow exists from the first changeset of stage 2 rather
#   than the last, because a capability with no workflow behind it has not
#   been shipped — that mistake was made once here already.
#
# INPUT: a stored extract, restored from the ACTIONS CACHE (since 073c; it was
# a CI artifact, downloadable by any GitHub account, until then). The key is
# extract-bian-v14-<raw_run_id>-<repo_digest> (DESIGN-OBSERVABILITY 9.5):
# with `raw_run_id` given the key is exact, so the extract of THAT run built
# by THIS commit is the only thing that can match; blank, the newest entry
# under the prefix extract-bian-v14- is taken and its key printed, so the log
# says which run and which commit built what was rendered. The path string
# must equal Extract's save path exactly -- the cache hashes it into the
# entry's version.
#
# ON A MISS this workflow does not regenerate anything (S.8): it emits
# `::error` and a `::notice` naming the exact Regenerate dispatch, and exits
# 2. Regenerating here would put Drive-touching code into a job designed not
# to have it. Entries live seven days from last use, so a miss after a quiet
# week is the normal case and costs one Regenerate run.
#
# The extract is verified INSIDE `run.py render` before anything is read
# (every file against EXTRACT.sha256, and -- when a run was pinned -- that the
# extract records that run as its source). A workflow step doing the same with
# `sha256sum -c` was removed at 073b: a green step here is not evidence the
# stage verified, and a second consumer could forget the step.

# TRIGGERS: workflow_dispatch / schedule only. Never pull_request or
# pull_request_target -- the Actions cache is private only while no fork
# PR can run a workflow in this repo (D-14).
on:
  workflow_dispatch:
    inputs:
      raw_run_id:
        description: >-
          Optional. Pin the acquisition run whose extract to render, e.g.
          33929539288-1 (the extract must have been built on this commit).
          Blank takes the newest cached extract, whichever run and commit
          built it, and prints its key.
        required: false
      add_category:
        description: "EXPERIMENT: also keep this category (reports only)"
        required: false
      drop_category:
        description: "EXPERIMENT: do not keep this category (reports only)"
        required: false

permissions:
  contents: read

concurrency:
  group: render-bian-v14
  cancel-in-progress: true

env:
  SOURCE_ID: bian-v14
  EXTRACT_CACHE_PATH: out/_extract/bian-v14

jobs:
  render:
    name: What would we publish from the stored model?
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit only: records egress, blocks nothing. Move to block
          # once a month of audit shows no unexpected hosts (A.15).
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Pinned for the same reason as the Extract workflow:
      # requirements-extract.txt hashes a wheel built per interpreter version.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements.txt
          python3 -m pip install --require-hashes -r requirements-extract.txt

      # Which key, decided in one place and printed. Pinned: exact, this run
      # and this commit. Blank: a primary key nothing can match, so the
      # prefix in restore-keys decides -- newest entry first.
      - name: Name the extract to restore
        id: key
        run: |
          set -euo pipefail
          digest=$(python3 tools/repo_manifest.py --digest)
          id="${{ inputs.raw_run_id }}"
          if [ -n "$id" ]; then
            echo "key=extract-bian-v14-${id}-${digest}" >> "$GITHUB_OUTPUT"
            echo "prefix=" >> "$GITHUB_OUTPUT"
            echo "  pinned: extract-bian-v14-${id}-${digest}"
          else
            echo "key=extract-bian-v14-" >> "$GITHUB_OUTPUT"
            echo "prefix=extract-bian-v14-" >> "$GITHUB_OUTPUT"
            echo "  newest under prefix extract-bian-v14- (this commit is ${digest})"
          fi

      - name: Take the extract from the Actions cache
        id: extract-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.EXTRACT_CACHE_PATH }}
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}

      # The miss contract (S.8): say what was missing and exactly how to make
      # it, then refuse. There is deliberately no fallback -- a render that
      # quietly re-extracted or re-fetched would produce a correct-looking
      # result by a route nobody asked for, and the log would be the only
      # evidence.
      - name: Was there an extract to render?
        run: |
          set -euo pipefail
          matched="${{ steps.extract-cache.outputs.cache-matched-key }}"
          if [ -z "$matched" ]; then
            id="${{ inputs.raw_run_id }}"
            echo "::error title=No stored extract::No cache entry for ${{ steps.key.outputs.key }}${{ steps.key.outputs.prefix && '*' || '' }}. Entries live 7 days from last use; this workflow never fetches or extracts."
            echo "::notice title=Regenerate it::Dispatch 'Regenerate — BIAN v14 (stage 3)' with raw_run_id=${id:-<blank, for the newest archived run>} and expect_digest=<the extract's content digest, if it is on record; else blank>, then re-run this workflow with the same raw_run_id."
            exit 2
          fi
          echo "  restored ${matched}"

      # Verifies the extract against its sidecar before reading it -- and,
      # when a run was pinned, that the extract records that run -- then
      # selects. A mismatch is exit 1 naming the file; no extract is exit 2.
      - name: Select
        run: |
          python3 run.py render "$SOURCE_ID" \
            ${{ inputs.raw_run_id && format('--expect-raw-run-id ''{0}''', inputs.raw_run_id) || '' }} \
            ${{ inputs.add_category && format('--add-category ''{0}''', inputs.add_category) || '' }} \
            ${{ inputs.drop_category && format('--drop-category ''{0}''', inputs.drop_category) || '' }}

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error title=Render failed::This is a SELECTION or CODE problem, or a missing input named above."
          echo "  No secrets are used here and no source is fetched."
          echo "  No stored extract -> the notice above names the Regenerate dispatch."
          echo "  Canary missing    -> the allowlist no longer keeps a known object."
          echo "  Below the floor   -> selection kept fewer objects than min_objects."
          echo "  Extract mismatch  -> a file differs from EXTRACT.sha256, or the extract was built from another run; the log names it."
