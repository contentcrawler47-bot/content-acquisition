name: Render — BIAN v14 (stage 2)

# STAGE 2: read a stored extract, apply the allowlist, report what would be
# published. Makes NO network requests at all — not to bian.org, not to Drive.
#
# References no Google Drive secrets and fetches no source, so a red run here
# is a SELECTION or CODE problem and nothing else. That separation is the same
# one the Extract and Validate workflows keep, and it is what makes a failure
# locatable without reading the log.
#
# WHAT THIS IS FOR
#   Changing what gets published used to mean another pass over someone else's
#   web server. Against a stored extract it is a re-render: run this with
#   --add-category or --drop-category and read the numbers. That is the whole
#   payoff of splitting extraction from rendering.
#
#   An experimental run is announced before and after its own numbers and can
#   never publish — this workflow writes no bundle and syncs nothing.
#
# WHAT IT DOES NOT DO YET
#   Selection only. Grouping, link resolution and diagram rendering are not
#   built. This workflow exists from the first changeset of stage 2 rather
#   than the last, because a capability with no workflow behind it has not
#   been shipped — that mistake was made once here already.
#
# INPUT: a stored extract — by default the most recent successful Extract
# run's, or a run you pin. There is no other source. A `fresh` option that
# fetched from bian.org existed until changeset 073b; it went because Acquire
# is the sole fetcher (R10), and because it had been invoking `extract`
# without the `--run-dir` it has required since 070. If there is no stored
# extract this workflow fails and says so; it never fetches.
#
# The extract is verified INSIDE `run.py render` before anything is read
# (every file against EXTRACT.sha256, since 073a). A workflow step doing the
# same with `sha256sum -c` was removed at 073b: a green step here is not
# evidence the stage verified, and a second consumer could forget the step.

# TRIGGERS: workflow_dispatch / schedule only. Never pull_request or
# pull_request_target -- the Actions cache is private only while no fork
# PR can run a workflow in this repo (D-14).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: >-
          Optional. Pin a specific "Extract — BIAN v14 (stage 3)" run. Leave
          blank to use the most recent successful one.
        required: false
      add_category:
        description: "EXPERIMENT: also keep this category (reports only)"
        required: false
      drop_category:
        description: "EXPERIMENT: do not keep this category (reports only)"
        required: false

permissions:
  contents: read
  # Only to download a prior run's extract artifact. Nothing here writes.
  actions: read

concurrency:
  group: render-bian-v14
  cancel-in-progress: true

env:
  SOURCE_ID: bian-v14

jobs:
  render:
    name: What would we publish from the stored model?
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit only: records egress, blocks nothing. Move to block
          # once a month of audit shows no unexpected hosts (A.15).
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Pinned for the same reason as the Extract workflow:
      # requirements-extract.txt hashes a wheel built per interpreter version.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements.txt
          python3 -m pip install --require-hashes -r requirements-extract.txt

      # Which extract, decided in one place and printed. If nothing is
      # found, this fails. There is deliberately no fallback — a reuse run
      # that quietly re-fetched would produce a correct-looking result by a
      # route nobody asked for, and the log would be the only evidence.
      - name: Resolve which extract to use
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="${{ inputs.run_id }}"
          if [ -n "$id" ]; then
            echo "  pinned to run $id"
          else
            id=$(gh run list --repo "$GITHUB_REPOSITORY" \
                   --workflow extract-bian-v14.yml --status success \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$id" ]; then
              echo "::error title=No stored extract::No successful 'Extract — BIAN v14 (stage 3)' run was found. Run it first; this workflow never fetches."
              exit 1
            fi
            echo "  most recent successful extract run: $id"
          fi
          echo "EXTRACT_RUN_ID=$id" >> "$GITHUB_ENV"
          echo "  $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"

      # v7 to match the two downloads in landscape-bian-v14.yml. Changeset 038
      # pinned v6 here by oversight; nothing is known to differ, but one repo
      # should pin one version.
      - name: Take the extract from that run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: extract-bian-v14
          path: out/_extract/bian-v14
          run-id: ${{ env.EXTRACT_RUN_ID }}
          github-token: ${{ github.token }}

      # Verifies the extract against its sidecar before reading it, then
      # selects. A mismatch is exit 1 naming the file; no extract is exit 2.
      - name: Select
        run: |
          python3 run.py render "$SOURCE_ID" \
            ${{ inputs.add_category && format('--add-category ''{0}''', inputs.add_category) || '' }} \
            ${{ inputs.drop_category && format('--drop-category ''{0}''', inputs.drop_category) || '' }}

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error title=Render failed::This is a SELECTION or CODE problem."
          echo "  No Drive credentials are used here and no source is fetched."
          echo "  Canary missing    -> the allowlist no longer keeps a known object."
          echo "  Below the floor   -> selection kept fewer objects than min_objects."
          echo "  No stored extract -> run Extract first."
          echo "  Extract mismatch  -> a file differs from EXTRACT.sha256; the log names it."
          echo "  Artifact expired  -> the pinned run is older than 90 days."
