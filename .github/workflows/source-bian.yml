name: Source — BIAN Service Landscape

# One workflow per source. Adding, changing, breaking or removing this file
# affects only BIAN: every other source has its own workflow, its own schedule,
# its own secrets and its own Drive subfolder.
#
# The publish step is the only place Drive credentials are referenced. Running
# with publish=false injects no credentials at all, so validation can be run
# freely — useful after changing the harvester or when BIAN ships a new version.
#
# Logs report counts and pass/fail only, never acquired text: Actions logs on a
# public repo are world-readable.

on:
  schedule:
    - cron: "0 3 * * 1"        # 03:00 UTC Mon = 15:00 NZST / 16:00 NZDT
  workflow_dispatch:
    inputs:
      publish:
        description: Sync to Google Drive after validation
        type: boolean
        default: true
      strict:
        description: Fail on warnings as well as errors
        type: boolean
        default: false

permissions:
  contents: write              # only for the keep-alive timestamp commit

concurrency:
  group: source-bian           # per source: never blocks other sources
  cancel-in-progress: false

env:
  RCLONE_VERSION: "1.71.1"
  SOURCE_ID: bian

jobs:
  bian:
    name: Acquire, validate and publish BIAN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # STAGE 1 — extraction. Uses no Drive credentials, so a failure here
      # is unambiguously a source problem. See the dedicated
      # "Validate — BIAN Service Landscape" workflow for the same checks
      # in isolation.
      - name: Extract and validate BIAN content
        id: extract
        run: python3 run.py validate "$SOURCE_ID" ${{ inputs.strict && '--strict' || '' }}

      - name: Extraction failed
        if: failure() && steps.extract.outcome == 'failure'
        run: |
          echo "::error title=EXTRACTION failed::Could not acquire BIAN content. Drive was never contacted."
          echo "Read the DIAGNOSIS block above — the failing stage names the cause."

      - name: Install rclone (pinned, checksum verified)
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          set -euo pipefail
          base="https://github.com/rclone/rclone/releases/download/v${RCLONE_VERSION}"
          pkg="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "${base}/${pkg}"
          curl -fsSLO "${base}/SHA256SUMS"
          grep " ${pkg}\$" SHA256SUMS | sha256sum -c -
          unzip -q "${pkg}"
          sudo install -m 755 "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rm -rf "${pkg}" SHA256SUMS "rclone-v${RCLONE_VERSION}-linux-amd64"

      # STAGE 2 — publishing. Only reached when extraction passed, so a
      # failure from here on is unambiguously a Drive problem.
      - name: Publish to Drive
        id: publish
        if: github.event_name == 'schedule' || inputs.publish
        env:
          # Shared publisher identity. Syncs only to content/bian, so this
          # cannot touch another source's folder.
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python3 run.py publish "$SOURCE_ID"

      - name: Publishing failed
        if: failure() && steps.extract.outcome == 'success'
        run: |
          echo "::error title=PUBLISHING failed::BIAN content extracted correctly, but the Drive sync failed."
          echo "This is not a source problem. Run 'Check publishing target (Google Drive)'."
          echo "Common causes: expired GDRIVE_TOKEN, revoked OAuth grant, Drive quota."

      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          mkdir -p .runs
          date -u +"%Y-%m-%dT%H:%M:%SZ" > ".runs/$SOURCE_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".runs/$SOURCE_ID"
          git commit -m "$SOURCE_ID run $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase --autostash && git push
