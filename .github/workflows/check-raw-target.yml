name: Check raw archive target (Google Drive)

# RAW-ARCHIVE validation only. Answers two questions: can the Acquire workflow's
# archive job reach Drive with these credentials, and what is under raw/ --
# and, with `pointers` on (the default since 073c), does every de-duplicated
# run still point at a sibling holder with the same raw digest (R11)? The
# sweep copies each run's RECORD files only, never payload.zip, so it costs a
# few hundred kilobytes for the whole archive. A pointed-to run that has been
# deleted is a finding here and nowhere else until the Health check (075).
#
# Touches no source. A red run here always means a Drive or archive problem --
# use "Acquire -- BIAN v14" with archive turned off to test acquisition alone.
# Prints the Drive quota, which retention decisions need and nothing else
# records.

# TRIGGERS: workflow_dispatch / schedule only. Never pull_request or
# pull_request_target -- the Actions cache is private only while no fork
# PR can run a workflow in this repo (D-14).
on:
  workflow_dispatch:
    inputs:
      pointers:
        description: Also sweep every pointer in the archive against its target
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: check-raw-target
  cancel-in-progress: true

env:
  # NOT named RCLONE_VERSION: rclone maps RCLONE_<FLAG> env vars onto
  # its own flags, so RCLONE_VERSION is read as --version (a boolean)
  # and every rclone invocation dies with a parse error.
  RC_VERSION: "1.71.1"

jobs:
  check-raw-target:
    name: Can we archive raw runs to Drive?
    runs-on: ubuntu-24.04
    # Drive credentials live in this Environment (A.3/D-11); a job
    # without it cannot see them.
    environment: drive
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit only: records egress, blocks nothing. Move to block
          # once a month of audit shows no unexpected hosts (A.15).
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install rclone (pinned, checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/rclone/rclone/releases/download/v${RC_VERSION}"
          pkg="rclone-v${RC_VERSION}-linux-amd64.zip"
          curl -fsSLO "${base}/${pkg}"
          curl -fsSLO "${base}/SHA256SUMS"
          grep " ${pkg}\$" SHA256SUMS | sha256sum -c -
          unzip -q "${pkg}"
          sudo install -m 755 "rclone-v${RC_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone

      - name: Check Drive credentials and reachability
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          python3 run.py check-raw-target ${{ inputs.pointers && '--pointers' || '' }}

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error title=Drive check failed::This is an ARCHIVE problem, not a source problem."
          echo "  Missing credentials -> add GDRIVE_TOKEN"
          echo "  Rejected credentials -> the OAuth token expired or was revoked;"
          echo "                          re-run 'rclone config' and update GDRIVE_TOKEN"
          echo "  Pointer finding     -> a de-duplicated run's target is absent, is itself a pointer, or"
          echo "                          has a different raw digest; never delete a run another run points to"
          echo "Acquisition is unaffected -- run Acquire with archive: false to test it alone."
