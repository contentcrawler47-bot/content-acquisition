name: Investigate — BIAN coverage gap

# RESOLVED 2026-08-22: the model is sharded across ~24 all_objects_data_N.js
# files and the source was reading only one, yielding 222 of 340 service
# domains. sources/bian/source.py now merges every shard.
#
# Kept so the shard probe can be re-run if coverage regresses. Safe to delete
# along with tools/diagnose_bian.py once you are confident.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    name: Probe BIAN data shards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Probe for data shards and check stereotype handling
        run: python3 tools/diagnose_bian.py
