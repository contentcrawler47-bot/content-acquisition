name: Acquire — BIAN v14 (stage 2)

# STAGE 2 only: acquire the landscape's raw artifacts and RETAIN them, with
# provenance. Renders nothing, publishes nothing. It parses the index, to know
# what to fetch, and since R8 it also DECLARES a gate scope -- the twelve
# view_<id>_data.js files the source input gate samples -- so the gate can run
# later against the retained run instead of reaching the network itself.
#
# Two JOBS, deliberately. `acquire` references NO Google Drive secrets, so a
# red acquire is always a source or code problem. `archive` copies the run
# to Drive under raw/<source>/<run-id>/ with its own credentials and its own
# failure; a red archive is a Drive problem and touched no source. Drive
# credentials come from the `drive` Environment, so the acquire job cannot see
# them at all. The run travels between the jobs in the ACTIONS CACHE under an
# exact key (R12, D-3): the cache has no public read endpoint and can only be
# restored by this repository's own workflows, whereas a CI artifact is
# downloadable by any GitHub account for its whole retention. Nothing here
# uploads an artifact, and `tools/check_workflows.py` refuses one.
#
# The archive is five uploads: run.json, manifest.json and RAW.sha256 plain,
# payload.zip holding every payload file as a member (~10x smaller than
# decoded), and ARCHIVED.json written last after the copy has been verified
# against Drive's own hashes. Per-file uploads were tried first and Drive's
# API pacing turned 723 files into an hour; one zip takes seconds. A folder
# carrying the marker is never touched again; a folder without it is an
# interrupted copy and is resumed. A run whose acquire job did not finish (no
# RAW.sha256) is refused -- it is not evidence and is not archived.
#
# DE-DUPLICATION (R11). Before staging, `archive` computes the run's digest
# over its payload sidecar lines and compares it with every archived run that
# holds payload bytes. Equal means the source served the same bytes: the run
# is archived as its records plus SAME_AS.json naming that run, and no
# payload.zip -- a few kilobytes, still an attributable record that the
# source was checked. Pointers are one hop, and a pointed-to run must not be
# deleted while a pointer names it. `check_raw.py` reads a pointer folder
# through its sibling.
#
# What is fetched is DECLARED in bianlib/acquire.py (SCOPES) and recorded in
# the run's run.json, with the counts stated separately: views KNOWN, views
# DECLARED, views STORED. `model-only` takes the data files, about a minute.
# `full` additionally fetches every declared view page -- several hundred
# requests against someone else's web server, which is why this workflow is
# dispatch-only and must stay so.
#
# A run is never rewritten. Its directory is named by the run id and attempt,
# and the command refuses a directory that already exists.
#
# Reports counts, sizes, statuses and digests only, never acquired text:
# Actions logs on a public repo are world-readable.

# TRIGGERS: workflow_dispatch / schedule only. Never pull_request or
# pull_request_target -- the Actions cache is private only while no fork
# PR can run a workflow in this repo (D-14).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Acquisition scope
        type: choice
        options:
          - model-only
          - full
        default: model-only
      archive:
        description: Archive the run to Drive after acquiring
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: acquire-bian-v14
  cancel-in-progress: true

env:
  SOURCE_ID: bian-v14
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  # NOT named RCLONE_VERSION: rclone maps RCLONE_<FLAG> env vars onto its
  # own flags, so RCLONE_VERSION is read as --version and every call dies.
  RC_VERSION: "1.71.1"
  # The same directory `run.py acquire` derives from GITHUB_RUN_ID and
  # GITHUB_RUN_ATTEMPT, so the check and cache steps can name it without
  # the acquire step telling them.
  RUN_DIR: out/_raw/bian-v14/${{ github.run_id }}-${{ github.run_attempt }}
  # Cache transport (DESIGN-OBSERVABILITY 9.5): exact key, no restore-keys,
  # and the SAME path string on save and restore -- the cache hashes the
  # path into the entry's version, so a different string is a miss. Any
  # later consumer of this run (Extract at 073c) restores with this key and
  # this path.
  CACHE_KEY: raw-bian-v14-${{ github.run_id }}-${{ github.run_attempt }}
  CACHE_PATH: out/_raw/bian-v14

jobs:
  acquire:
    name: Can we retain the BIAN landscape as raw artifacts?
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit only: records egress, blocks nothing. Move to block
          # once a month of audit shows no unexpected hosts (A.15).
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Acquisition is standard library only. requirements.txt is installed
      # so the API source imports cleanly during discovery; without it that
      # source is reported as a load failure, harmless here but
      # indistinguishable in the log from a real one.
      - name: Install the pinned source dependency
        run: python3 -m pip install --require-hashes -r requirements.txt

      - name: Acquire
        run: |
          python3 run.py acquire "$SOURCE_ID" --mode "${{ inputs.mode }}"

      # Three questions: was it finished (sidecar present), is it intact
      # (every digest verifies), is it whole (every declared artifact
      # stored). --require-complete makes a partial run red: a red run here
      # means something the source's own index declares was not fetched.
      - name: Check the run
        if: always()
        run: |
          python3 tools/check_raw.py "$RUN_DIR" --require-complete

      # Handed to the archive job whether or not the checks passed: a failed
      # acquisition is the thing you most want to look at, and `archive`
      # refuses on its own if the run never finished. Saved only when the run
      # directory exists -- `cache/save` on an absent path is a hard error,
      # and a red acquire should emit one error, not two.
      - name: Is there a run directory to hand over?
        id: have
        if: always()
        run: |
          if [ -d "$RUN_DIR" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "  no run directory was written"; fi

      - name: Hand the run to the archive job (Actions cache)
        if: always() && steps.have.outputs.run == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_KEY }}

  archive:
    name: Can we archive the run to Drive, immutably?
    needs: acquire
    # Runs after a red acquire too: a partial or failed run is still a record
    # worth keeping, and `archive` refuses on its own if the run never
    # finished. Skipped only when the operator asked not to archive.
    if: ${{ always() && inputs.archive && needs.acquire.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    # Drive credentials live in this Environment (A.3/D-11); a job
    # without it cannot see them.
    environment: drive
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit only: records egress, blocks nothing. Move to block
          # once a month of audit shows no unexpected hosts (A.15).
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install rclone (pinned, checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/rclone/rclone/releases/download/v${RC_VERSION}"
          pkg="rclone-v${RC_VERSION}-linux-amd64.zip"
          curl -fsSLO "${base}/${pkg}"
          curl -fsSLO "${base}/SHA256SUMS"
          grep " ${pkg}\$" SHA256SUMS | sha256sum -c -
          unzip -q "${pkg}"
          sudo install -m 755 "rclone-v${RC_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone

      # Exact key: this run's, saved by the acquire job minutes ago. A miss
      # is a hard failure rather than a fallback, because there is nothing
      # else that could legitimately be archived under this run id. A miss
      # on a RE-RUN of this job means the entry has aged out (7 days unused)
      # and the run must be re-acquired as a new run id.
      - name: Take the run from the acquire job (Actions cache)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true

      # Exit 0 archived and verified -- as a pointer when the bytes are
      # already held; 2 refused by a guard (already holds a run, unfinished,
      # or fails its own local check); 1 anything else.
      - name: Archive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          python3 run.py archive "$SOURCE_ID" --run-id "$RUN_ID"

      - name: Explain a failure
        if: failure()
        run: |
          echo "A red ARCHIVE is a Drive problem or a guard; the acquire job touched no Drive."
          echo "  cache miss -> the acquire job wrote no run, or this is a re-run more than 7 days later; re-acquire as a new run"
          echo "  exit 2: refused -- the remote folder already carries ARCHIVED.json, is a first-layout folder, or the run never finished"
          echo "  missing credentials -> GDRIVE_TOKEN"
          echo "  rejected credentials -> the OAuth token expired; re-run 'rclone config', update GDRIVE_TOKEN"
          echo "Run 'Check raw archive target' to test the Drive half alone; it lists every run with its state and pointers."
