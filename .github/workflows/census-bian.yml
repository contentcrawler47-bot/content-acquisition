name: Census — BIAN landscape counts

# Produces the landscape's headline counts with their denominators stated, so
# REFERENCE-DATA.md can be updated from a measurement rather than from memory.
#
# Supersedes "Investigate — BIAN coverage gap", which tested two hypotheses
# that were both resolved on 22 August 2026 and which counted the service
# domain category by literal match — the 018 bug it was written to diagnose.
#
# Read-only. No credentials, no secrets, publishes nothing. About 48 requests
# paced at a second, gzip-encoded, roughly 12 MB.
#
# The counts are printed to the log and uploaded as JSON. They are
# MEASUREMENTS: record them in REFERENCE-DATA.md on Drive, never in a skill.

# TRIGGERS: workflow_dispatch / schedule only. Never pull_request or
# pull_request_target -- the Actions cache is private only while no fork
# PR can run a workflow in this repo (D-14).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: census-bian
  cancel-in-progress: true

jobs:
  census:
    name: Count objects, service domains and relations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit only: records egress, blocks nothing. Move to block
          # once a month of audit shows no unexpected hosts (A.15).
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run the census
        run: python3 tools/landscape_census.py --json census.json

      - name: Upload the counts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: landscape-census
          path: census.json
          if-no-files-found: error
          retention-days: 30
