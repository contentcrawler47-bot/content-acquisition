name: Regenerate — BIAN v14 (stage 3)

# REGENERATION (P.7): rebuild an extract from its ARCHIVED run and prove it
# equal to what the original run produced, then put it back in the Actions
# cache for Render. Fetches nothing from the source, renders nothing,
# publishes nothing.
#
# This is the workflow the Render workflow's cache-miss notice names (S.8).
# Cache entries live seven days from last use; a stage never regenerates its
# own upstream, so when Render finds no extract it stops and says to run this.
#
# It mirrors the Extract workflow with two differences. The run is restored
# from DRIVE ONLY -- never from the cache -- because the point is to show the
# retained input plus this commit reproduce the extract, not that a cached
# copy is still there (the raw entry IS refreshed afterwards, as transport to
# the extract job and for the next consumer). And `expect_digest`, when given,
# is checked THROUGH `bianlib.extract.verify` -- the same code Render runs --
# so a regenerated extract that differs from the record is refused by the
# consumer's own check, and is not cached. Blank `expect_digest` regenerates
# and caches without proving an equality; the log then carries the digest for
# the record.
#
# Two JOBS, as in Extract: `restore` under the `drive` Environment is the
# only job that can see Drive credentials; `extract` references NO secrets.
# Cache keys and paths are Extract's, exactly (DESIGN-OBSERVABILITY 9.5):
#   raw     : raw-bian-v14-<raw_run_id>          path out/_raw/bian-v14
#   extract : extract-bian-v14-<raw_run_id>-<repo_digest>
#                                                path out/_extract/bian-v14
# Nothing here uploads an artifact.
#
# The gate ENFORCES here, always: a regenerated extract that would not pass
# the gate is not the extract Render should read, whatever the original run
# was dispatched with.
#
# Reports counts, sizes and digests only, never acquired text: Actions logs
# on a public repo are world-readable.

# TRIGGERS: workflow_dispatch / schedule only. Never pull_request or
# pull_request_target -- the Actions cache is private only while no fork
# PR can run a workflow in this repo (D-14).
on:
  workflow_dispatch:
    inputs:
      raw_run_id:
        description: >-
          Archived acquisition run to regenerate the extract of, e.g.
          33929539288-1. Blank means the newest archived run under
          raw/bian-v14/ on Drive.
        required: false
      expect_digest:
        description: >-
          Optional. The content digest the original extract of this run had
          (16 or 64 hex), e.g. a82abbd7e52e8558 for the golden run. When
          given, the regenerated extract must declare it or the run is red
          and nothing is cached.
        required: false

permissions:
  contents: read

concurrency:
  group: regenerate-bian-v14
  cancel-in-progress: true

env:
  SOURCE_ID: bian-v14
  # NOT named RCLONE_VERSION: rclone maps RCLONE_<FLAG> env vars onto its
  # own flags, so RCLONE_VERSION is read as --version and every call dies.
  RC_VERSION: "1.71.1"
  RAW_CACHE_PATH: out/_raw/bian-v14
  EXTRACT_CACHE_PATH: out/_extract/bian-v14
  # The canary and floors are stated here rather than hidden in the tool so a
  # reader of the run can see what was demanded of it. They are bounds, not
  # equalities: a gate that catches a broken mechanism, not one demanding
  # perfection. Never widen one to turn a red run green.
  CANARY_ID: "34300"
  CANARY_NAME: Consumer Loan
  MIN_OBJECTS: "100000"
  MIN_VIEWS: "2000"
  MIN_SERVICE_DOMAINS: "340"
  # Source input gate. Stated here, like the canary and the floors, so a
  # reader of the run can see what was demanded of it.
  #
  # SET FROM MEASUREMENT on run 33489429857 (full) and 33488890577
  # (model-only), which agree. The whole measured population is now declared:
  # G03 1,359, G15 42,861, G23 10, plus two sampled findings, each REGISTERED
  # with a bound. So the thresholded population is empty, and anything landing
  # in it is something undeclared that has appeared -- for which the honest
  # bound is near zero rather than a margin sized to clear a known defect.
  #
  # These are deliberately tight. A source that changes shape SHOULD turn the
  # build red; the alternative is a bound wide enough to hide the next fault.
  # The counts have not moved across seven consecutive runs, so there is no
  # variance here to accommodate.
  #
  # Never widen one to turn a red run green. If a measurement legitimately
  # moves, that is a DECISION-LOG entry and a new number, not an edit to make
  # CI pass.
  GATE_MAX_SHARE: "0.05"
  GATE_MAX_ABSOLUTE: "25"
  GATE_MAX_TOTAL_SHARE: "0.1"

jobs:
  restore:
    name: Can we bring the archived run back from Drive, verified?
    runs-on: ubuntu-24.04
    # Drive credentials live in this Environment (A.3/D-11); a job
    # without it cannot see them.
    environment: drive
    timeout-minutes: 20
    outputs:
      raw_run_id: ${{ steps.resolve.outputs.raw_run_id }}
      payload_run_id: ${{ steps.resolve.outputs.payload_run_id }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit only: records egress, blocks nothing. Move to block
          # once a month of audit shows no unexpected hosts (A.15).
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Standard library otherwise. requirements.txt is installed so the API
      # source imports cleanly during discovery; without it that source is
      # reported as a load failure, harmless here but indistinguishable in
      # the log from a real one.
      - name: Install the pinned source dependency
        run: python3 -m pip install --require-hashes -r requirements.txt

      - name: Install rclone (pinned, checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/rclone/rclone/releases/download/v${RC_VERSION}"
          pkg="rclone-v${RC_VERSION}-linux-amd64.zip"
          curl -fsSLO "${base}/${pkg}"
          curl -fsSLO "${base}/SHA256SUMS"
          grep " ${pkg}\$" SHA256SUMS | sha256sum -c -
          unzip -q "${pkg}"
          sudo install -m 755 "rclone-v${RC_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone

      # Which run, decided in one place and printed: the id given, or the
      # newest archived run on Drive (P.2's default, from Drive until
      # .runs/INDEX.jsonl exists at 074). Refuses an id that is absent,
      # incomplete or points through a broken pointer. Copies nothing yet.
      - name: Resolve which run to extract
        id: resolve
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          python3 run.py restore "$SOURCE_ID" --run-id "${{ inputs.raw_run_id }}" --resolve-only

      # Drive, always: the run folder and, for a de-duplicated run, the
      # folder it points to, side by side under out/_raw/bian-v14/. Each is
      # verified against its own RAW.sha256 before this step exits 0, so
      # nothing that fails to verify is ever cached under the run's key.
      - name: Copy the run from Drive and verify it
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          python3 run.py restore "$SOURCE_ID" --run-id "${{ steps.resolve.outputs.raw_run_id }}"

      # The cache is the transport to the extract job. Saving over an
      # existing entry is a warning, not a save; look first, and take the
      # existing entry -- Acquire's or Extract's, verified when saved -- when
      # there is one.
      - name: Is the run already cached?
        id: have-raw
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.RAW_CACHE_PATH }}
          key: raw-bian-v14-${{ steps.resolve.outputs.raw_run_id }}
          lookup-only: true

      - name: Hand the run to the extract job (Actions cache)
        if: steps.have-raw.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.RAW_CACHE_PATH }}
          key: raw-bian-v14-${{ steps.resolve.outputs.raw_run_id }}

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error title=Restore failed::A red RESTORE is a Drive or archive problem; no source was touched and no extract was built."
          echo "  exit 2: refused -- the run is absent, incomplete (no ARCHIVED.json), or points through a broken pointer"
          echo "  does not verify -> the archived copy no longer matches its own RAW.sha256; dispatch 'Check raw archive target', which sweeps the pointers"
          echo "  missing credentials -> GDRIVE_TOKEN"
          echo "  rejected credentials -> the OAuth token expired; re-run 'rclone config', update GDRIVE_TOKEN"

  extract:
    name: Does the archived run plus this commit reproduce the extract?
    needs: restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAW_RUN_ID: ${{ needs.restore.outputs.raw_run_id }}
      RUN_DIR: out/_raw/bian-v14/${{ needs.restore.outputs.raw_run_id }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit only: records egress, blocks nothing. Move to block
          # once a month of audit shows no unexpected hosts (A.15).
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Pinned, because requirements-extract.txt hashes a compiled wheel
      # (rpds-py) built per interpreter version. Taking whatever Python the
      # runner image ships would mean an image bump silently selecting a wheel
      # with no matching hash.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Both files. setup-python provides a clean interpreter, so without
      # requirements.txt the API source fails to import and discovery reports
      # it as a load failure — harmless for this source, but indistinguishable
      # in the log from a real one.
      - name: Install pinned validation dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements.txt
          python3 -m pip install --require-hashes -r requirements-extract.txt

      # Exact key: the restore job put it there minutes ago (or Acquire did,
      # days ago). A miss is a hard failure rather than a fallback, because
      # this job has no credentials and must not acquire.
      - name: Take the run from the restore job (Actions cache)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.RAW_CACHE_PATH }}
          key: raw-bian-v14-${{ env.RAW_RUN_ID }}
          fail-on-cache-miss: true

      # Finished, intact, whole -- before anything reads it (S.6). A pointer
      # run is read through its sibling and the check says so.
      - name: Check the run
        run: |
          python3 tools/check_raw.py "$RUN_DIR" --require-complete

      - name: Rebuild the extract
        run: |
          python3 run.py extract "$SOURCE_ID" --run-dir "$RUN_DIR" \
            --gate-max-share "$GATE_MAX_SHARE" \
            --gate-max-absolute "$GATE_MAX_ABSOLUTE" \
            --gate-max-total-share "$GATE_MAX_TOTAL_SHARE"

      # Every check Extract runs, plus the equality: with `expect_digest` the
      # extract must declare that content digest, checked through
      # `bianlib.extract.verify` -- the consumer's own verification -- so the
      # proof is the same code Render will run against the cached entry.
      - name: Check the extract, and that it is the one expected
        run: |
          python3 tools/check_extract.py "$EXTRACT_CACHE_PATH" \
            --require-schema \
            --require-gate \
            ${{ inputs.expect_digest && format('--expect-digest ''{0}''', inputs.expect_digest) || '' }} \
            --canary-id "$CANARY_ID" \
            --canary-name "$CANARY_NAME" \
            --min-objects "$MIN_OBJECTS" \
            --min-views "$MIN_VIEWS" \
            --min-service-domains "$MIN_SERVICE_DOMAINS"

      # The key names the run AND the code. The digest is computed over the
      # checked-out tree by the same function `Verify repo contents` uses,
      # so it equals the `producer.repo_digest` the extract records.
      - name: Name the extract's cache key
        id: key
        run: |
          digest=$(python3 tools/repo_manifest.py --digest)
          echo "key=extract-bian-v14-${RAW_RUN_ID}-${digest}" >> "$GITHUB_OUTPUT"
          echo "  extract-bian-v14-${RAW_RUN_ID}-${digest}"

      # Saving over an existing entry is a warning, not a save; look first so
      # a re-run on the same run and commit is silent about it.
      - name: Is this extract already cached?
        id: have
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.EXTRACT_CACHE_PATH }}
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # Only a checked, expected extract is cached: a red check above means
      # this step never runs and Render keeps missing, which is the honest
      # outcome -- the record and the rebuild disagree, and the log says so.
      - name: Repopulate the cache for Render
        if: steps.have.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.EXTRACT_CACHE_PATH }}
          key: ${{ steps.key.outputs.key }}

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error title=Regenerate failed::A red REGENERATE is a code or data problem; this job has no credentials and fetched nothing. Nothing was cached."
          echo "  cache miss         -> the restore job saved nothing, or this is a re-run more than 7 days later; re-run the whole workflow"
          echo "  Check the run      -> the restored run does not verify or is not complete; 'Check raw archive target' lists and sweeps the archive"
          echo "  Rebuild            -> the parser, or a run that no longer matches its own manifest"
          echo "  not the one expected -> this commit does not reproduce expect_digest from this run (S.7 broken, or the wrong digest was given); the log prints the digest it did produce"
          echo "  gate or floor      -> read the finding, never widen the bound"
