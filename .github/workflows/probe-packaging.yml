name: Probe — model packaging

# Four questions about the BIAN model's package structure that only the source
# can answer. A session inferred package structure from object ids and then
# established that ids are CREATION order, not tree position — which left the
# inference resting on nothing for elements.
#
#   T1  Does any object carry a package / folder / path / location property?
#       landscape._properties() already parses a per-object property table
#       that the extract discards. Measured over the whole population.
#   T2  Are Folder names stripped by the source, or by our parser? All 309
#       arrive named "Folder"; the raw entry tells the two cases apart.
#   T3  Is there an object -> model mapping we have missed? 247 ArchiMate
#       diagram objects are in no view, on no view and in no relation, so
#       their package is assigned by id proximity alone.
#   T4  Relation verb counts with denominators. REFERENCE-DATA says
#       `realized by` is roughly 5,400; the extract holds 14,532.
#
# References no secrets and writes nothing back. Prints field names and counts
# truncated to 80 characters — never documentation prose, because logs on a
# public repo are world-readable. Delete once the answers are on Drive.

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source id to probe
        default: bian-v14
        required: false
      delay:
        description: Seconds between requests
        default: "1.0"
        required: false

permissions:
  contents: read

concurrency:
  group: probe-packaging
  cancel-in-progress: true

jobs:
  probe:
    name: Is the package structure recoverable?
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Probe model packaging
        run: |
          python3 tools/probe_packaging.py \
            --source "${{ inputs.source }}" \
            --delay "${{ inputs.delay }}" \
            --json packaging.json

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-packaging
          path: packaging.json
          if-no-files-found: warn
          retention-days: 90
